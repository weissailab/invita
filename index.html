<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invita — invitaciones digitales que se confirman por WhatsApp, gratis</title>
<meta name="description" content="Arma la invitación de tu boda, quince, cumpleaños o grado en 3 minutos. Se abre como un sobre, trae cuenta regresiva y cada invitado confirma por WhatsApp con su nombre. Gratis y sin registro.">
<meta name="theme-color" content="#8C6A3F">
<!-- La invitación viaja en el fragmento (#), que nunca llega al servidor: la
     vista previa al compartir es siempre la misma. La escribimos para el caso
     real, que es un invitado recibiendo el link por WhatsApp. -->
<meta property="og:title" content="Estás invitado 💌">
<meta property="og:description" content="Toca para abrir tu invitación y confirmar tu asistencia.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://weissailab.github.io/invita/">
<meta property="og:image" content="https://weissailab.github.io/invita/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap">

     siga corriendo el código viejo. Súbela al cambiar app.js o app.css. -->

</head>
